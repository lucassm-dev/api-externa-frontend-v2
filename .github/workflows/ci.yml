name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        shell: bash
        run: npm test | tee resultado-testes.tap

      - name: Build e orçamento do bundle
        run: npm run build

      - name: onp-ui-ux validate
        run: npx onp-ui-ux validate src/ --ci

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-testes
          path: resultado-testes.tap

  spec-audit:
    name: Spec Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # O audit acusa prova desatualizada comparando o mtime do código com a data
      # do último verify; no checkout todo arquivo nasce com a hora do job. Aqui a
      # prova (.spec/verification) vai no mesmo commit que o código, depois do
      # verify, então a data do commit não serve: o código que não mudou desde o
      # último commit da prova fica com mtime 0, e só o que mudou depois dele
      # continua com a hora do job e reprova.
      - name: mtime dos fontes conforme o último commit da prova
        run: |
          FONTES="src index.html vite.config.ts proxy.config.ts package.json"
          PROVA=$(git log -1 --format=%H -- .spec/verification)
          git ls-files -- $FONTES | perl -ne 'chomp; utime(0, 0, $_)'
          git diff --name-only "$PROVA" HEAD -- $FONTES | perl -ne 'chomp; utime(undef, undef, $_) if -e $_'

      - name: onp-spec audit --ci
        run: node .claude/skills/onp-spec-driven-claude-v4-0-0/scripts/onp-spec.mjs audit --ci
