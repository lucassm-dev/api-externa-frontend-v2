name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        shell: bash
        run: npm test | tee resultado-testes.tap

      - name: Build e orçamento do bundle
        run: npm run build

      - name: onp-ui-ux validate
        run: npx onp-ui-ux validate src/ --ci

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-testes
          path: resultado-testes.tap

  spec-audit:
    name: Spec Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # O audit acusa prova desatualizada comparando o mtime do código com a data
      # do último verify; no checkout todo arquivo nasce com a hora do job. Aqui a
      # prova (.spec/verification) vai no mesmo commit que o código, depois do
      # verify, então a data do commit não serve: o código que não mudou desde a
      # prova mais antiga entre as features fica com mtime 0, e só o que mudou
      # depois dela continua com a hora do job e reprova. sinais.json fica de fora:
      # o próprio audit o reescreve, não é prova.
      - name: mtime dos fontes conforme a prova mais antiga
        run: |
          FONTES="src index.html vite.config.ts proxy.config.ts package.json"
          PROVA=$(for f in .spec/verification/*.json; do [ "$f" = .spec/verification/sinais.json ] || git log -1 --format='%ct %H' -- "$f"; done | sort -n | head -1 | cut -d' ' -f2)
          git ls-files -- $FONTES | perl -ne 'chomp; utime(0, 0, $_)'
          git diff --name-only "$PROVA" HEAD -- $FONTES | perl -ne 'chomp; utime(undef, undef, $_) if -e $_'

      - name: onp-spec audit --ci
        run: node .claude/skills/onp-spec-driven-claude-v4-0-0/scripts/onp-spec.mjs audit --ci

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend

      - uses: actions/checkout@v4
        with:
          repository: lucassm-dev/api-externa-backend-v1
          path: backend

      # O docker-compose do backend monta o front de produção (nginx) a partir de
      # FRONTEND_PATH: aqui ele aponta para o código deste PR. Senhas descartáveis,
      # geradas a cada execução. Sem BRAPI, CVM nem SMTP: os fluxos não dependem deles.
      - name: Subir banco, backend e front de produção
        working-directory: backend
        run: |
          echo "E2E_ADMIN_SENHA=E2e$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          source "$GITHUB_ENV"
          cat > .env <<ENV
          POSTGRES_DB=investimentos
          POSTGRES_USER=investimentos
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -base64 48)
          ADMIN_EMAIL=admin@e2e.local
          ADMIN_SENHA=$E2E_ADMIN_SENHA
          FRONTEND_PATH=../frontend
          ENV
          docker compose up -d --build

      - name: Esperar o nginx e a API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/saude > /dev/null \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://localhost:8081/auth/me)" = "401" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "o backend não respondeu em 5 minutos"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências e o Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Fluxos de ponta a ponta
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8081
          E2E_ADMIN_EMAIL: admin@e2e.local
        run: node --test --test-reporter=spec e2e/fluxos.e2e.mjs

      - name: Log dos containers
        if: failure()
        working-directory: backend
        run: |
          mkdir -p ../frontend/e2e/capturas
          docker compose logs --no-color > ../frontend/e2e/capturas/containers.log 2>&1 || true

      - name: Publicar capturas e log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-falha
          path: frontend/e2e/capturas/
