<header class="barra">
  <span class="marca">Carteira</span>

  @if (compacto()) {
    <button
      appBotao
      intencao="sutil"
      tamanho="compacto"
      type="button"
      class="menu-alternar"
      data-menu
      aria-controls="areas-do-produto"
      [attr.aria-expanded]="menuAberto()"
      (click)="alternarMenu()"
    >
      Menu
    </button>
  }

  <nav
    id="areas-do-produto"
    class="areas"
    [class.areas-compacta]="compacto()"
    [hidden]="compacto() && !menuAberto()"
    data-areas
    aria-label="Áreas do produto"
  >
    @for (area of areas; track area.rota) {
      <a
        class="area"
        [routerLink]="area.rota"
        routerLinkActive="ativa"
        #ativa="routerLinkActive"
        [attr.aria-current]="ativa.isActive ? 'page' : null"
        [attr.data-area]="area.rota"
        (click)="fecharMenu()"
        >{{ area.rotulo }}</a
      >
    }
  </nav>

  <div class="identidade">
    <div class="perfil" data-identidade-investidor>
      <span class="perfil-texto">
        <span class="perfil-rotulo">Investidor</span>
        <span class="email" [attr.title]="email()">{{ email() }}</span>
      </span>
      <span class="avatar" data-avatar-investidor aria-hidden="true">{{ iniciais() }}</span>
    </div>

    <app-botao-icone
      class="acao-utilitaria"
      [rotulo]="rotuloTema()"
      data-alternar-tema
      [attr.data-tema-atual]="tema()"
      (pressionado)="alternarTema()"
    >
      @if (tema() === 'claro') {
        <svg lucideMoon data-icone-tema="lua" aria-hidden="true" focusable="false"></svg>
      } @else {
        <svg lucideSun data-icone-tema="sol" aria-hidden="true" focusable="false"></svg>
      }
    </app-botao-icone>

    <app-botao-icone
      class="acao-utilitaria"
      rotulo="Sair do sistema"
      data-sair
      (pressionado)="sair()"
    >
      <svg lucideLogOut aria-hidden="true" focusable="false"></svg>
    </app-botao-icone>
  </div>
</header>

@if (sessaoAcabando()) {
  <div class="aviso" data-aviso-sessao>
    <app-mensagem-feedback
      nivel="aviso"
      [mensagem]="
        'Sua sessão acaba em menos de ' +
        minutosDeAviso +
        ' minutos. Entre novamente para não perder o que estiver fazendo.'
      "
    />
    <button
      appBotao
      intencao="primaria"
      type="button"
      data-entrar-novamente
      (click)="entrarNovamente()"
    >
      Entrar novamente
    </button>
  </div>
}

<main class="conteudo">
  <router-outlet />
</main>
