<header class="barra">
  <span class="marca">Carteira</span>

  @if (compacto()) {
    <button
      appBotao
      intencao="sutil"
      tamanho="compacto"
      type="button"
      class="menu-alternar"
      data-menu
      aria-controls="areas-do-produto"
      [attr.aria-expanded]="menuAberto()"
      (click)="alternarMenu()"
    >
      Menu
    </button>
  }

  <nav
    id="areas-do-produto"
    class="areas"
    [class.areas-compacta]="compacto()"
    [hidden]="compacto() && !menuAberto()"
    data-areas
    aria-label="Áreas do produto"
  >
    @for (area of areas; track area.rota) {
      <a
        class="area"
        [routerLink]="area.rota"
        routerLinkActive="ativa"
        #ativa="routerLinkActive"
        [attr.aria-current]="ativa.isActive ? 'page' : null"
        [attr.data-area]="area.rota"
        (click)="fecharMenu()"
        >{{ area.rotulo }}</a
      >
    }
  </nav>

  <div class="identidade">
    <span class="email">{{ email() }}</span>
    <button
      mat-stroked-button
      type="button"
      data-alternar-tema
      [attr.data-tema-atual]="tema()"
      (click)="alternarTema()"
    >
      {{ tema() === 'claro' ? 'Tema escuro' : 'Tema claro' }}
    </button>
    <button mat-stroked-button type="button" data-sair (click)="sair()">Sair</button>
  </div>
</header>

@if (sessaoAcabando()) {
  <div class="aviso" data-aviso-sessao>
    <app-mensagem-feedback
      nivel="aviso"
      [mensagem]="
        'Sua sessão acaba em menos de ' + minutosDeAviso + ' minutos. Entre novamente para não perder o que estiver fazendo.'
      "
    />
    <button mat-flat-button type="button" data-entrar-novamente (click)="entrarNovamente()">
      Entrar novamente
    </button>
  </div>
}

<main class="conteudo">
  <router-outlet />
</main>
