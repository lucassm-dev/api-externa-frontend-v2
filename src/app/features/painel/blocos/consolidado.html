<section class="bloco" data-consolidado>
  <header class="cabecalho">
    <h2>Consolidado da carteira</h2>

    <label class="seletor">
      <span class="rotulo">Carteira</span>
      <select
        data-seletor-carteira
        [value]="carteiraSelecionada()"
        (change)="escolher($any($event.target).value)"
      >
        @for (carteira of carteiras(); track carteira.id) {
          <option [value]="carteira.id" [selected]="carteira.id === carteiraSelecionada()">
            {{ carteira.nome }}
          </option>
        }
      </select>
    </label>
  </header>

  @if (carregando()) {
    <div class="esqueleto" data-esqueleto-consolidado aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  } @else if (valores(); as valores) {
    <ul class="indicadores">
      <li class="indicador" data-indicador>
        <p class="indicador-rotulo" data-indicador-rotulo>Valor investido</p>
        <p class="indicador-valor" data-indicador-valor>
          <span data-valor-investido>{{ valores.investido }}</span>
        </p>
      </li>
      <li class="indicador" data-indicador>
        <p class="indicador-rotulo" data-indicador-rotulo>Valor de mercado</p>
        <p class="indicador-valor" data-indicador-valor>
          <span data-valor-de-mercado>{{ valores.mercado }}</span>
        </p>
      </li>
      <li class="indicador indicador--resultado" data-indicador>
        <p class="indicador-rotulo" data-indicador-rotulo>Resultado não realizado</p>
        <p class="indicador-valor" data-indicador-valor data-lucro-nao-realizado>
          <app-variacao [valor]="valores.resultado" moeda="BRL" />
        </p>
        <app-selo
          class="indicador-selo"
          data-selo-resultado
          [variante]="seloResultado().variante"
          [texto]="seloResultado().texto"
        />
      </li>
    </ul>

    <p class="cambio" data-taxa-cambio>
      <span class="rotulo">Dólar usado na conversão</span>
      <app-valor-com-horario [valor]="valores.taxa" [obtidoEm]="valores.taxaObtidaEm" />
    </p>

    @for (aviso of avisos(); track aviso) {
      <div class="aviso" data-aviso-consolidado>
        <app-mensagem-feedback nivel="aviso" [mensagem]="aviso" />
      </div>
    }
  }
</section>
