<div class="fundo" (click)="cancelar.emit()"></div>

<div class="dialogo" role="alertdialog" aria-modal="true" aria-labelledby="dialogo-titulo">
  <h2 id="dialogo-titulo" data-titulo>{{ titulo() }}</h2>
  <p data-consequencia>{{ consequencia() }}</p>

  <div class="acoes">
    <button
      appBotao
      intencao="sutil"
      type="button"
      data-cancelar
      [desabilitado]="ocupado()"
      (click)="cancelar.emit()"
    >
      {{ rotuloCancelar() }}
    </button>
    <button
      appBotao
      intencao="primaria"
      type="button"
      data-confirmar
      [ocupado]="ocupado()"
      (click)="confirmar.emit()"
    >
      {{ rotuloConfirmar() }}
    </button>
  </div>
</div>
