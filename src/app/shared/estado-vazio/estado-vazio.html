<section class="estado" [attr.aria-labelledby]="tituloId">
  <svg class="icone" lucideInbox aria-hidden="true" focusable="false"></svg>
  <h2 [id]="tituloId" data-titulo>{{ titulo() }}</h2>
  <p data-descricao>{{ descricao() }}</p>
  <button type="button" data-proximo-passo (click)="acao.emit()">
    <span>{{ rotuloAcao() }}</span>
    <svg lucideArrowRight aria-hidden="true" focusable="false"></svg>
  </button>
</section>
